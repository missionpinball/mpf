name: Lint all Python files

on:
  push:
    branches:
      - dev
      - 0.57.x
      - 0.58.x
      - 0.59.x
      - 0.80.x
      - 0.81.x
      - 0.82.x
  pull_request:
    branches:
      - dev
      - 0.57.x
      - 0.58.x
      - 0.59.x
      - 0.80.x
      - 0.81.x
      - 0.82.x

jobs:
  prospector:
    name: Run Prospector on all Python files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install MPF
        run: |
          sudo apt-get install -y libjpeg-dev
          pip install --upgrade pip setuptools wheel build
          pip install "prospector==1.19.1" "pylint==4.0.9" # frozen Sept 2026 to avoid minor bumps adding new rules
          pip install -e .

      - name: Run Prospector
        run: prospector
