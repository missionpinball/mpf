#config_version=6
mode:
  priority: 100002
  game_mode: False
  start_events: reset_complete
  stop_events: shutdown
  stop_on_ball_end: False


slide_player:
  # door open
  service_door_opened:
    service_door_open:
      action: play
  service_door_closed:
    service_door_open:
      action: remove
  master_volume_decrease:
    service_volume_changed:
      action: play
      expire: 3s
  master_volume_increase:
    service_volume_changed:
      action: play
      expire: 3s

  # menu
  service_menu_show:
    service_menu:
      action: play
      priority: 1
  service_menu_hide:
    service_menu:
      action: remove

  # switch test
  service_switch_test_start:
    service_switch_test:
      action: play
      priority: 2
  service_switch_test_stop:
    service_switch_test:
      action: remove

  # coil test:
  service_coil_test_start:
    service_coil_test:
      action: play
      priority: 2
  service_coil_test_stop:
    service_coil_test:
      action: remove

  # light test:
  service_light_test_start:
    service_light_test:
      action: play
      priority: 2
  service_light_test_stop:
    service_light_test:
      action: remove

  # confirm slides
  service_options_slide_start:
    service_options_slide:
      action: play
      priority: 2
  service_options_slide_stop:
    service_options_slide:
      action: remove

  # software update
  service_software_update_choice:
    software_update:
      action: play
      priority: 2
  service_software_update_stop:
    software_update:
      action: remove

  # settings:
  service_settings_start:
    service_settings:
      action: play
      priority: 2
    service_settings_edit:
      action: remove
  service_settings_edit:
    service_settings_edit:
      action: play
      priority: 3
  service_settings_stop:
    service_settings:
      action: remove

  # volume:
  service_volume_start:
    service_settings:
      action: play
      priority: 2
    service_settings_edit:
      action: remove
  service_volume_edit:
    service_settings_edit:
      action: play
      priority: 3
  service_volume_stop:
    service_settings:
      action: remove

  # audits:
  service_audits_menu_show:
    service_audits_menu:
      action: play
      priority: 1
  service_audits_menu_hide:
    service_audits_menu:
      action: remove

widget_player:
  # power off
  service_power_off:
    service_power_off_door_open:
      action: add
      slide: service_door_open
    service_power_off_coil_test:
      action: add
      slide: service_coil_test
  service_power_on:
    service_power_off_door_open:
      action: remove
      slide: service_door_open
    service_power_off_coil_test:
      action: remove
      slide: service_coil_test

  # menu items
  service_menu_selected:
    service_menu_item:
      action: add
      slide: service_menu
  service_menu_deselected:
    service_menu_item:
      action: remove
      slide: service_menu
